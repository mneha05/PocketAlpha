name: Android MVVM + Coroutines

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Verify MVVM + coroutine architecture
        run: |
          grep -q "class AppViewModel" android/app/src/main/java/com/nehamahesh/pocketalpha/AppViewModel.kt
          grep -q "viewModelScope.launch" android/app/src/main/java/com/nehamahesh/pocketalpha/AppViewModel.kt
          grep -q "MutableStateFlow" android/app/src/main/java/com/nehamahesh/pocketalpha/AppViewModel.kt
          grep -q "class PocketAlphaRepository" android/app/src/main/java/com/nehamahesh/pocketalpha/PocketAlphaRepository.kt
          grep -q "coroutineScope" android/app/src/main/java/com/nehamahesh/pocketalpha/PocketAlphaRepository.kt
          grep -q "async" android/app/src/main/java/com/nehamahesh/pocketalpha/PocketAlphaRepository.kt
          grep -q "withContext(Dispatchers.IO)" android/app/src/main/java/com/nehamahesh/pocketalpha/ApiClient.kt
          grep -q "collectAsStateWithLifecycle" android/app/src/main/java/com/nehamahesh/pocketalpha/MainActivity.kt
          echo "MVVM + Coroutines architecture verified"
